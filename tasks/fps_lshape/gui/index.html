<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>L-Platform</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; font-family: monospace; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 8px; color: #e6edf3; background: rgba(0,0,0,.55);
         padding: 6px 8px; font-size: 12px; line-height: 1.4; border-radius: 4px; white-space: pre; }
  #banner { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            color: #fff; font-size: 40px; font-weight: bold; text-shadow: 0 2px 8px #000; pointer-events: none; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
               border: 2px solid rgba(255,255,255,.8); border-radius: 50%; pointer-events: none; }
</style>
<script>__THREE__</script>
<script>__POINTERLOCK__</script>
</head>
<body>
<div id="hud" role="status" aria-live="polite"></div>
<div id="crosshair"></div>
<div id="banner"></div>
<script>
// ---------------------------------------------------------------------------
// World: an L-shaped platform. Player starts at the far end of the SHORT leg,
// facing the corner (-Z). The goal is at the far end of the LONG leg, which
// runs along +X from the corner.
//
//        z
//        ^
//  start |###|
//        |###|  short leg (LEG_W x SHORT_LEN)
//        |###|
// corner |#########################|  long leg (LONG_LEN x LEG_W)  goal
//        +---------------------------> x
//
// Controls: mouse look (three.js PointerLockControls), WASD move (only while
// held: SPEED u/s applied per frame in tick), Space jump.
// ---------------------------------------------------------------------------
const LEG_W = 3, SHORT_LEN = 8, LONG_LEN = 16;
const START = { x: LEG_W / 2, z: SHORT_LEN - 1.0 };
const GOAL  = { x: LONG_LEN - 1.0, z: -LEG_W / 2 };
const GOAL_R = 0.9;
const EYE = 1.6, SPEED = 6.0, JUMP_V = 6.0, GRAVITY = 20.0;

const state = {
  x: START.x, y: 0, z: START.z, yaw: 0,   // yaw = camera rotation.y; 0 => facing -Z (PointerLockControls convention)
  reached: false, fell: false, falls: 0, jumps: 0,
  keydowns: 0, mousemoves: 0, mouse_dx: 0, locked: false, keys: {},
  started_at: Date.now(), reached_at: null,
};
window.__state = state;

function onPlatform(x, z) {
  const inShort = x >= 0 && x <= LEG_W && z >= -LEG_W && z <= SHORT_LEN;
  const inLong  = x >= 0 && x <= LONG_LEN && z >= -LEG_W && z <= 0;
  return inShort || inLong;
}
function progress(x, z) {
  const legA = Math.max(0, Math.min(1, (START.z - z) / (START.z - GOAL.z)));
  const legB = Math.max(0, Math.min(1, (x - START.x) / (GOAL.x - START.x)));
  const total = (START.z - GOAL.z) + (GOAL.x - START.x);
  return ((START.z - GOAL.z) * legA + (GOAL.x - START.x) * legB) / total;
}
window.__progress = () => progress(state.x, state.z);

// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 18, 40);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x202030, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(5, 10, 3); scene.add(sun);

function slab(w, d, cx, cz, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.5, d), new THREE.MeshStandardMaterial({ color }));
  m.position.set(cx, -0.25, cz); scene.add(m);
  const g = new THREE.GridHelper(Math.max(w, d), Math.max(w, d), 0x3a4a6a, 0x2a3650);
  g.position.set(cx, 0.01, cz); g.scale.set(w / Math.max(w, d), 1, d / Math.max(w, d)); scene.add(g);
}
slab(LEG_W, SHORT_LEN + LEG_W, LEG_W / 2, (SHORT_LEN - LEG_W) / 2, 0x4b5f8a);
slab(LONG_LEN - LEG_W, LEG_W, LEG_W + (LONG_LEN - LEG_W) / 2, -LEG_W / 2, 0x5a6f9a);

const goal = new THREE.Mesh(new THREE.CylinderGeometry(GOAL_R, GOAL_R, 0.2, 24),
  new THREE.MeshStandardMaterial({ color: 0x33ff88, emissive: 0x11aa44 }));
goal.position.set(GOAL.x, 0.1, GOAL.z); scene.add(goal);
const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 6, 8),
  new THREE.MeshBasicMaterial({ color: 0x66ffaa, transparent: true, opacity: 0.5 }));
beacon.position.set(GOAL.x, 3, GOAL.z); scene.add(beacon);

// --- Controls: three.js PointerLockControls (mouse look) ---------------------
const controls = new THREE.PointerLockControls(camera, document.body);
scene.add(controls.getObject());
controls.getObject().position.set(START.x, EYE, START.z);
camera.rotation.set(0, 0, 0);  // face -Z
document.body.addEventListener('click', () => { if (!controls.isLocked) controls.lock(); });
controls.addEventListener('lock', () => { state.locked = true; });
controls.addEventListener('unlock', () => { state.locked = false; });
// Fallback when the Pointer Lock API is unavailable/refused (e.g. some embedded
// webviews): feed raw mouse deltas into the same controls math via its public
// object rotation, so mouse-look still works without a lock.
document.addEventListener('mousemove', (ev) => {
  state.mousemoves++; state.mouse_dx += ev.movementX || 0;
  if (!controls.isLocked) {
    const e = new THREE.Euler(0, 0, 0, 'YXZ').setFromQuaternion(camera.quaternion);
    e.y -= (ev.movementX || 0) * 0.002;
    e.x -= (ev.movementY || 0) * 0.002;
    e.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, e.x));
    camera.quaternion.setFromEuler(e);
  }
});

// --- Movement ----------------------------------------------------------------
const hud = document.getElementById('hud');
const banner = document.getElementById('banner');
const held = { w: false, a: false, s: false, d: false };
let vy = 0, grounded = true;
const KEYMAP = { w: 'w', a: 'a', s: 's', d: 'd', arrowup: 'w', arrowdown: 's', arrowleft: 'a', arrowright: 'd' };

function reset() {
  Object.assign(state, { x: START.x, y: 0, z: START.z, yaw: 0, reached: false, fell: false, falls: 0,
    jumps: 0, keydowns: 0, mousemoves: 0, mouse_dx: 0, keys: {}, started_at: Date.now(), reached_at: null });
  controls.getObject().position.set(START.x, EYE, START.z);
  camera.rotation.set(0, 0, 0); vy = 0; grounded = true;
  for (const k in held) held[k] = false;
  banner.style.display = 'none';
}
let flashT = null;
function flash(text, color) {
  banner.textContent = text; banner.style.color = color; banner.style.display = 'flex';
  clearTimeout(flashT); if (!state.reached) flashT = setTimeout(() => banner.style.display = 'none', 900);
}
function moveBy(fwd, right) {  // uses PointerLockControls' own movement helpers
  if (state.reached) return;
  camera.updateMatrix();  // moveForward/moveRight read camera.matrix, which is otherwise refreshed only at render
  if (fwd) controls.moveForward(fwd);
  if (right) controls.moveRight(right);
}
function jump() { if (grounded && !state.reached) { vy = JUMP_V; grounded = false; state.jumps++; } }

addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  state.keydowns++; state.keys[k] = (state.keys[k] || 0) + 1;
  const m = KEYMAP[k];
  if (m) { held[m] = true; ev.preventDefault(); }  // movement happens only while held (see tick) else if (k === ' ' || k === 'space' || k === 'spacebar') { jump(); ev.preventDefault(); }
});
addEventListener('keyup', ev => { const m = KEYMAP[ev.key.toLowerCase()]; if (m) held[m] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; });

// Programmatic hooks for the oracle / tests (not the OS input path): __press moves 1 unit per call.
window.__press = (k) => { const m = KEYMAP[k.toLowerCase()]; if (m) moveBy(m === 'w' ? 1 : m === 's' ? -1 : 0, m === 'd' ? 1 : m === 'a' ? -1 : 0); else if (k === ' ') jump(); };
window.__look = (deg) => { camera.rotation.y -= deg * Math.PI / 180; };
window.__reset = reset;

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const fwd = (held.w ? 1 : 0) - (held.s ? 1 : 0), right = (held.d ? 1 : 0) - (held.a ? 1 : 0);
  if (fwd || right) moveBy(fwd * SPEED * dt, right * SPEED * dt);
  const p = controls.getObject().position;
  if (!grounded) { vy -= GRAVITY * dt; p.y += vy * dt; if (p.y <= EYE) { p.y = EYE; vy = 0; grounded = true; } }
  state.x = p.x; state.z = p.z; state.y = p.y - EYE;
  state.yaw = new THREE.Euler(0, 0, 0, 'YXZ').setFromQuaternion(camera.quaternion).y;
  if (!state.reached && grounded && !onPlatform(state.x, state.z)) {
    state.fell = true; state.falls++;
    p.set(START.x, EYE, START.z); camera.rotation.set(0, 0, 0);
    flash('FELL! reset', '#ff6666');
  }
  if (!state.reached && Math.hypot(state.x - GOAL.x, state.z - GOAL.z) <= GOAL_R + 0.3) {
    state.reached = true; state.reached_at = Date.now(); flash('GOAL!', '#66ff99');
  }
  beacon.rotation.y += 0.02;
  hud.textContent = `x=${state.x.toFixed(2)} z=${state.z.toFixed(2)} yaw=${(state.yaw * 180 / Math.PI).toFixed(0)}° lock=${state.locked}\n` +
    `progress=${(progress(state.x, state.z) * 100).toFixed(0)}% reached=${state.reached} falls=${state.falls}\n` +
    `keydowns=${state.keydowns} mousemoves=${state.mousemoves}  mouse=look  hold WASD=move  Space=jump`;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.focus();
</script>
</body>
</html>
